<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller CSS3</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header id="inicio">
        <h1>Taller CSS3</h1>
        <p>Flexbox, Grid, Hover y Responsive Design</p>
    </header>

    <!-- MENÚ FLEXBOX -->
    <nav class="menu">
        <a href="#inicio">Inicio</a>
        <a href="#galeria">Galería</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <!-- GALERÍA GRID -->
    <section class="galeria" id="galeria">
        <div class="caja">Caja 1</div>
        <div class="caja">Caja 2</div>
        <div class="caja">Caja 3</div>
        <div class="caja">Caja 4</div>
        <div class="caja">Caja 5</div>
        <div class="caja">Caja 6</div>
    </section>

    <!-- SERVICIOS -->
    <section class="contenido" id="servicios">
        <h2>Servicios</h2>
        <p>
            Desarrollo de páginas web, diseño responsive,
            aplicaciones web y soporte técnico.
        </p>
    </section>

    <!-- CONTACTO -->
    <section class="contenido" id="contacto">
        <h2>Contacto</h2>
        <p>Correo: ejemplo@gmail.com</p>
        <p>Teléfono: 300 000 0000</p>
    </section>

    <!-- BOTONES -->
    <section class="botones">
        <button>Botón 1</button>
        <button>Botón 2</button>
        <button>Botón 3</button>
    </section>

</body>
</html>
